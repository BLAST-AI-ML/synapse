repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version
  rev: v0.16.10
  hooks:
    # Run the linter
    - id: ruff-check
      # TODO Handle ignored rules and re-enable them selectively
      args: [--fix, --exit-non-zero-on-fix, "--extend-ignore=ASYNC230,BLE001,SIM117"]
    # Run the formatter
    - id: ruff-format

# Scan for secret files that should not be committed
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
